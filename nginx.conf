proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=tapera_cache:10m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # CRITICAL: Service worker must never be cached or auto-update won't work
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy API calls to local Peserta Node.js API
    location /api/peserta/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Auth API calls (register digital account)
    location /api/auth/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy KPR API calls
    location /api/kpr/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to Tapera Sikumbang (avoids CORS in production)
    location /api/tapera/ {
        proxy_pass https://sikumbang.tapera.go.id/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sikumbang.tapera.go.id;
        proxy_set_header Origin "https://sikumbang.tapera.go.id";
        proxy_set_header Referer "https://sikumbang.tapera.go.id/";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name sikumbang.tapera.go.id;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Increase proxy buffers for large API payloads and headers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Caching
        proxy_cache tapera_cache;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504 updating;
        proxy_cache_background_update on;
        proxy_cache_valid 200 60m;
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # Proxy Tapera Images (to fix Cross-Origin-Resource-Policy errors)
    location /api/tapera-static/ {
        proxy_pass https://sikumbang.tapera.go.id/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host sikumbang.tapera.go.id;
        proxy_set_header Referer https://sikumbang.tapera.go.id/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name sikumbang.tapera.go.id;
        
        # Force override CORP and CORS headers
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA fallback - serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
